<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .login-card {
            width: 380px;
            padding: 35px;

            background: white;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .login-card h1 {
            margin-bottom: 30px;

            color: #333;

            font-size: 28px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #444;

            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;

            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
        }

        .login-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }

        .login-btn:hover {
            background: #5568d8;
        }

        .reset-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #eeeeee;

            color: #444;

            font-size: 16px;

            cursor: pointer;

            margin-top: 10px;
        }

        .reset-btn:hover {
            background: #dddddd;
        }

        .register-text {
            margin-top: 20px;

            color: #555;

            font-size: 14px;
        }

        .register-text a {
            color: #667eea;

            font-weight: bold;

            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="login-card">

        <h1>LOGIN FORM</h1>

        <form id="loginform" action="/login" method="post">

            <div class="form-group">

                <label>User name:</label>

                <input
                    type="text"
                    id="Username"
                    name="username"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password:</label>

                <input
                    type="password"
                    id="Password"
                    name="password"
                    required
                >

            </div>


            <input
                type="submit"
                value="Login"
                class="login-btn"
            >


            <input
                type="reset"
                value="Reset"
                class="reset-btn"
            >


            <p class="register-text">

                Don't have an account?

                <a href="/register">
                    Register here
                </a>

            </p>

        </form>

    </div>

</body>
</html>
