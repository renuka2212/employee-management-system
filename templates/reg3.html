<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .register-card {
            width: 380px;

            padding: 35px;

            background: white;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .register-card h2 {
            margin-bottom: 30px;

            color: #333;

            font-size: 28px;
        }

        .form-group {
            text-align: left;

            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #444;

            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;

            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
        }

        .register-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .register-btn:hover {
            background: #5568d8;
        }

        .reset-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #eeeeee;

            color: #444;

            font-size: 16px;

            cursor: pointer;

            margin-top: 10px;
        }

        .reset-btn:hover {
            background: #dddddd;
        }

        .login-text {
            margin-top: 20px;

            color: #555;

            font-size: 14px;
        }

        .login-text a {
            color: #667eea;

            font-weight: bold;

            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="register-card">

        <h2>REGISTRATION FORM</h2>


        {% if error %}

        <p style="color: red; font-weight: bold;">
            {{ error }}
        </p>

        {% endif %}


        <form
            id="registrationForm"
            action="/register"
            method="POST">


            <div class="form-group">

                <label>Full name:</label>

                <input
                    type="text"
                    id="Fullname"
                    name="fullname"
                    required>

            </div>


            <div class="form-group">

                <label>User name:</label>

                <input
                    type="text"
                    id="Username"
                    name="username"
                    required>

            </div>


            <div class="form-group">

                <label>Password:</label>

                <input
                    type="password"
                    id="Password"
                    name="password"
                    required>

            </div>


            <input
                type="submit"
                value="Register"
                class="register-btn">


            <input
                type="reset"
                value="Reset"
                class="reset-btn">


            <p class="login-text">

                Already have an account?

                <a href="/login">
                    Login here
                </a>

            </p>

        </form>

    </div>

</body>

</html>
